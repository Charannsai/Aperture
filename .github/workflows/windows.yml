name: Windows x64 preview installer
on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        type: boolean
        description: Upload candidate only after storage/no-spend validation
        default: false
permissions:
  contents: read
concurrency:
  group: windows-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Expand readable source overlay
        shell: pwsh
        run: Expand-Archive 1-source-overlay.zip -DestinationPath overlay
      - name: Build isolated unsigned Windows preview
        shell: pwsh
        run: ./overlay/scripts/build-windows.ps1 -Source "$env:RUNNER_TEMP\silk-vscode"
      - name: Validate install, runtime and uninstall
        shell: pwsh
        run: ./overlay/scripts/test-installer.ps1 -Source "$env:RUNNER_TEMP\silk-vscode"
      - name: Upload candidate installer
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: silk-preview-windows-x64-candidate
          path: |
            overlay/artifacts/*.exe
            overlay/artifacts/SHA256.txt
            overlay/artifacts/*.png
            overlay/artifacts/smoke-result.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
