name: Windows x64 preview installer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      VSCODE_QUALITY: preview
      VSCODE_PUBLISH_COUNTER: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Locate Windows SDK binary tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending
          if (-not $tools) { throw 'Windows SDK x64 signtool not found' }
          $tools[0].Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Windows SDK tool: $($tools[0].FullName)"
      - name: Build isolated unsigned Windows preview
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Source "$env:RUNNER_TEMP\silk-vscode"
      - name: Validate install, runtime and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Source "$env:RUNNER_TEMP\silk-vscode"
      - name: Prepare retained candidate and real CPU model
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force review,tooling | Out-Null
          Copy-Item artifacts/Aperture-Preview-Windows-x64-Setup.exe review/Aperture-Preview-Windows-x64-Setup.exe
          $p = Start-Process -FilePath (Resolve-Path review/Aperture-Preview-Windows-x64-Setup.exe) -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP\aperture-review-install",'/MERGETASKS=!runcode,!addtopath,!associatewithfiles,!addcontextmenufiles,!addcontextmenufolders') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          npm install --prefix tooling --no-audit --no-fund playwright@1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          Invoke-WebRequest https://github.com/ggml-org/llama.cpp/releases/download/b12322/llama-b12322-bin-win-cpu-x64.zip -OutFile "$env:RUNNER_TEMP\llama.zip"
          Expand-Archive "$env:RUNNER_TEMP\llama.zip" "$env:RUNNER_TEMP\llama"
          Invoke-WebRequest https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf -OutFile "$env:RUNNER_TEMP\qwen.gguf"
          if ((Get-FileHash "$env:RUNNER_TEMP\qwen.gguf").Hash.ToLower() -ne '1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32') { throw 'Model digest mismatch' }
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama" -Filter llama-server.exe -Recurse | Select-Object -First 1
      - name: Review settled UI, startup logs and real model edit
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),cp=require('node:child_process');
          const {_electron:electron}=require('playwright');
          const root=process.env.RUNNER_TEMP, out=path.resolve('review'),exe=path.join(root,'aperture-review-install','Aperture Preview.exe');fs.mkdirSync(out,{recursive:true});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));const report={checks:[],profiles:[]};let app,w,f;
          const command=async(s)=>{await w.keyboard.press('Control+Shift+P');await w.keyboard.type(s);await wait(500);await w.keyboard.press('Enter');await w.locator('.quick-input-widget').waitFor({state:'hidden',timeout:10000}).catch(()=>{});await wait(1000);};
          const settled=async()=>{for(const frame of w.frames()){if(await frame.locator('#prompt').count()){f=frame;break;}}assert.ok(f,'assistant webview');await f.locator('#prompt').waitFor();await f.evaluate(async()=>{await Promise.all(document.getAnimations({subtree:true}).map(a=>a.finished.catch(()=>{})));});await wait(350);};
          const shot=async(name)=>{await settled();await w.screenshot({path:path.join(out,name+'.png')});};
          async function launch(label,disable){const scratch=path.join(root,'aperture-review-work',label),project=path.join(scratch,'project'),profile=path.join(scratch,'profile');fs.mkdirSync(project,{recursive:true});fs.mkdirSync(path.join(profile,'User'),{recursive:true});const file=path.join(project,'add.ts');fs.writeFileSync(file,'export function add(a: number, b: number): number { return a - b; }\n');const cfg={'workbench.startupEditor':'none','telemetry.telemetryLevel':'off','files.autoSave':'off','window.dialogStyle':'custom','aperture.provider':'openai-compatible','aperture.endpoint':'http://127.0.0.1:18761','aperture.model':'qwen2.5-coder-0.5b-local'};if(disable)cfg['chat.disableAIFeatures']=true;fs.writeFileSync(path.join(profile,'User','settings.json'),JSON.stringify(cfg));app=await electron.launch({executablePath:exe,args:[project,file,'--user-data-dir='+profile,'--extensions-dir='+path.join(scratch,'extensions'),'--skip-welcome','--skip-release-notes','--disable-workspace-trust','--log','trace'],timeout:60000});w=await app.firstWindow();await w.locator('.monaco-workbench').waitFor({timeout:60000});await app.evaluate(({BrowserWindow})=>{const b=BrowserWindow.getAllWindows()[0];b.setSize(1366,768);b.center();});await w.setViewportSize({width:1366,height:768});report.activeProfile=profile;await wait(5000);f=undefined;for(let i=0;i<12;i++){await command('Aperture: Open Assistant');try{await settled();break;}catch{await wait(3000);}}await wait(10000);await shot(label+'-10sec');await wait(15000);await shot(label+'-25sec');const notifications=await w.locator('.notifications-toasts').innerText().catch(()=>'');report.profiles.push({label,disableUpstreamAI:disable,notifications});return{scratch,project,profile,file};}
          function copyLogs(profile,label){const source=path.join(profile,'logs');if(fs.existsSync(source))fs.cpSync(source,path.join(out,label+'-logs'),{recursive:true});}
          (async()=>{let state,model;try{const findExe=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory()){const x=findExe(p);if(x)return x;}else if(e.name==='llama-server.exe')return p;}};const modelExe=findExe(path.join(root,'llama'));assert.ok(modelExe,'CPU model binary found');model=cp.spawn(modelExe,['-m',path.join(root,'qwen.gguf'),'--host','127.0.0.1','--port','18761','-c','2048','-t','2','-np','1','-n','256','--alias','qwen2.5-coder-0.5b-local'],{stdio:['ignore',fs.openSync(path.join(out,'model-same-process-stdout.log'),'w'),fs.openSync(path.join(out,'model-same-process-stderr.log'),'w')]});model.on('error',e=>{report.modelSpawnError=String(e)});for(let i=0;i<90;i++){try{if((await fetch('http://127.0.0.1:18761/health')).ok){report.modelReady=true;break;}}catch{}await wait(1000);}assert.ok(report.modelReady,'same-process real model healthy');state=await launch('final-default',false);await f.locator('#theme').click();await w.locator('.monaco-workbench.vs').waitFor();await shot('settled-light-1366');await f.locator('#theme').click();await w.locator('.monaco-workbench.vs-dark').waitFor();await shot('settled-dark-1366');await app.evaluate(({BrowserWindow})=>BrowserWindow.getAllWindows()[0].setSize(1024,728));await w.setViewportSize({width:1024,height:728});await shot('settled-dark-1024');const footer=await f.locator('footer').evaluate(e=>({y:e.getBoundingClientRect().y,height:e.getBoundingClientRect().height})),height=await f.evaluate(()=>innerHeight);report.footer={box:footer,viewportHeight:height,contained:footer.y+footer.height<=height+1};assert.ok(report.footer.contained,'footer fits narrow laptop viewport');await app.evaluate(({BrowserWindow})=>BrowserWindow.getAllWindows()[0].setSize(1366,768));await w.setViewportSize({width:1366,height:768});await w.keyboard.press('Control+p');await w.keyboard.type('add.ts');await wait(400);await w.keyboard.press('Enter');await wait(400);await w.keyboard.press('Control+l');await f.locator('.context-chip').waitFor();await f.locator('[data-mode=edit]').click();await f.locator('#prompt').fill('Fix add to add its two parameters instead of subtracting. Preserve the function signature. Return only the replacement function in one fenced typescript code block.');report.modelHealthAtRequest=(await fetch('http://127.0.0.1:18761/health')).status;await f.locator('#send').click();await f.getByText('Review diff',{exact:true}).waitFor({timeout:120000});report.modelOutput=await f.locator('.assistant .message-body').last().innerText();assert.match(report.modelOutput,/return\s+a\s*\+\s*b\s*;/);await shot('real-model-proposal');await f.getByText('Review diff',{exact:true}).click();await w.locator('.monaco-diff-editor').waitFor({timeout:20000});await shot('real-model-diff');await f.getByText('Apply with confirmation',{exact:true}).click();await w.getByRole('button',{name:'Apply change',exact:true}).waitFor({timeout:10000});await w.screenshot({path:path.join(out,'real-model-confirm.png')});await w.getByRole('button',{name:'Apply change',exact:true}).click();await f.getByText('Edit applied to the editor.',{exact:false}).waitFor();assert.match(fs.readFileSync(state.file,'utf8'),/return a - b/);await w.keyboard.press('Control+p');await w.keyboard.type('add.ts');await wait(400);await w.keyboard.press('Enter');await wait(400);await command('File: Save All');await wait(800);report.saved=fs.readFileSync(state.file,'utf8');assert.match(report.saved,/return\s+a\s*\+\s*b\s*;/);report.checks.push('real local Qwen CPU streaming proposal','native diff','visible confirmation','unsaved edit leaves disk unchanged','explicit Save writes corrected function');await shot('real-model-saved');await app.close();app=undefined;app=await electron.launch({executablePath:exe,args:[state.project,state.file,'--user-data-dir='+state.profile,'--extensions-dir='+path.join(state.scratch,'extensions'),'--skip-welcome','--skip-release-notes','--disable-workspace-trust'],timeout:60000});w=await app.firstWindow();await w.locator('.monaco-workbench').waitFor({timeout:60000});await w.setViewportSize({width:1366,height:768});await wait(4000);assert.match((await w.locator('.view-lines').allInnerTexts()).join(' ').replace(/\u00a0/g,' '),/return\s+a\s*\+\s*b/);await w.screenshot({path:path.join(out,'real-model-restart.png')});report.checks.push('corrected code persists after app restart');await app.close();app=undefined;copyLogs(state.profile,'upstream-ai-off');report.passed=true;}catch(e){report.error=String(e.stack||e);if(w){fs.writeFileSync(path.join(out,'failure-ui.txt'),await w.locator('body').innerText().catch(()=>''));await w.screenshot({path:path.join(out,'review-failure.png'),timeout:10000}).catch(()=>{});}throw e;}finally{if(model)model.kill();if(app)await app.close().catch(()=>{});if(state)copyLogs(state.profile,'last');else if(report.activeProfile)copyLogs(report.activeProfile,'failure');fs.writeFileSync(path.join(out,'review-result.json'),JSON.stringify(report,null,2));}})().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content tooling/review.cjs
          node tooling/review.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Targeted review failed; see retained diagnostics' }
      - name: Preserve tested candidate as draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "windows-preview-${{ github.run_number }}"
          $notes = @'
          Unsigned Windows x64 preview candidate. Draft pending visual review.
          Build, disposable install, launch, themes, file-save, context, disconnected-provider guard, terminal, restart and uninstall checks passed. Real local CPU Qwen test verified streamed code proposal, native diff, confirmation, unsaved apply and explicit save. No model bundled.
          Not a full regression suite or feature-parity claim. AI needs a separately configured model/provider; external providers may charge. No model is bundled. No autonomous terminal execution. Updater disabled. Microsoft Marketplace rights are not supplied.
          '@
          $notes | Set-Content draft-notes.md
          $files = @('artifacts/Aperture-Preview-Windows-x64-Setup.exe','artifacts/SHA256.txt','artifacts/smoke-result.json') + @(Get-ChildItem artifacts/*.png,review/*.png,review/*.json -File | Where-Object { $_.Length -gt 0 } | ForEach-Object { $_.FullName }); gh release create $tag @files --repo ${{ github.repository }} --draft --prerelease --target $(git rev-parse HEAD) --title "Aperture Preview - Windows x64 candidate ${{ github.run_number }}" --notes-file draft-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release preservation failed' }
